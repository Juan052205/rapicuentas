name: rapicuentas
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+11

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  in_app_purchase: ^3.2.0 # O la versión más reciente compatible
  image_picker: ^1.1.2
  image_cropper: ^8.0.3
  google_mobile_ads: ^9.0.0
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.1
  url_launcher: ^6.3.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: true
  min_sdk_android: 21